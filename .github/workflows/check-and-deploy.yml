name: Check stock & deploy
on:
  schedule:
    - cron: "23 * * * *"   # hourly, off the top of the hour; GitHub often skips schedules, so hourly still lands inside ~3h
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: boardwatch, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python checker/check_stock.py
        env:
          REVERB_API_TOKEN: ${{ secrets.REVERB_API_TOKEN }}
      - run: python generator/build_site.py
      - name: Commit updated data (history)
        run: |
          git config user.name "boardwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "stock check $(date -u +%FT%TZ)" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
